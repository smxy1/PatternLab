<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- UTF-8 erlaubt deutsche Umlaute wie ä, ö, ü und ß im Dokument. -->
  <!-- Viewport sorgt dafür, dass die Seite auf mobilen Geräten richtig skaliert. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Neues Häkel- oder Strickprojekt erstellen - Lade PDF-Anleitungen hoch und verwalte Metadaten">
  <title>Neues Projekt - PatternLab</title>
  <link rel="icon" type="image/png" href="design/logo.png">
  <!-- Open Sans wird als zentrale Schriftart der Anwendung geladen. -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Gemeinsamer Layout-Container für Sidebar und Hauptbereich. -->
  <div class="container">
    
    <!-- ============================================================
         SIDEBAR: Navigation
         ============================================================ -->
    <aside class="sidebar">
      <!-- App-Name in der Sidebar. -->
      <div class="sidebar-header">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" aria-label="Navigation öffnen">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="sidebar-brand">
          <img class="sidebar-logo" src="design/logo.png" alt="PatternLab Logo">
          <span class="app-title">PatternLab</span>
        </div>
      </div>
      
      <!-- Hauptnavigation zwischen Dashboard und Projektformular. -->
      <div class="sidebar-menu-panel">
        <nav id="main-navigation">
          <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="new-project.html">Neues Projekt</a></li>
          </ul>
        </nav>

        <!-- Schaltflächen für Kontrastmodus und Schriftgröße.
             Die Klassen werden von CSS gestaltet und von JavaScript mit Klickfunktionen verbunden. -->
        <div class="accessibility-controls">
          <button class="contrast-toggle" type="button" aria-pressed="false" aria-label="Kontrast erhöhen"></button>
          <button class="text-size-toggle" type="button" aria-label="Schriftgröße erhöhen, aktuell 100 Prozent">A</button>
        </div>

        <!-- Link zum Impressum. -->
        <footer>
          <a href="imprint.html">Impressum</a>
        </footer>
      </div>
    </aside>

    <!-- ============================================================
         HAUPTBEREICH: Projektformular
         ============================================================ -->
    <main class="main-content">
      <!-- Das Formular wird für neue Projekte und zum Bearbeiten bestehender Projekte genutzt. -->
      <section class="form-container">
        <h1>Neues Projekt</h1>
        
        <!-- JavaScript verarbeitet die Eingaben und speichert sie im LocalStorage. -->
        <form id="project-form" class="project-form">
          
          <!-- ============================================================
               FELDGRUPPE 1: Pflichtfelder (Titel, Kategorie)
               ============================================================ -->
          <!-- fieldset gruppiert zusammengehörige Formularfelder; legend ist die sichtbare Überschrift dazu. -->
          <fieldset>
            <legend>Projektinformationen</legend>
            
            <div class="form-group">
              <label for="project-title">Projekttitel *</label>
              <input type="text" id="project-title" name="title" placeholder="Socken, Schal..." required>
            </div>

            <div class="form-group">
              <label for="project-category">Kategorie *</label>
              <select id="project-category" name="category" required>
                <option value="">Kategorie wählen</option>
                <option value="haekeln">Häkeln</option>
                <option value="stricken">Stricken</option>
                <option value="andere">Andere</option>
              </select>
            </div>
          </fieldset>

          <!-- ============================================================
               FELDGRUPPE 2: Optionale Metadaten
               ============================================================ -->
          <!-- Optionale Felder dürfen leer bleiben und werden später mit Ersatztext angezeigt. -->
          <fieldset>
            <legend>Optionale Metadaten</legend>
            
            <div class="form-group">
              <label for="project-description">Beschreibung</label>
              <textarea id="project-description" name="description" placeholder="Beschreibe dein Projekt hier..."></textarea>
            </div>

            <div class="form-group">
              <label for="project-material">Material</label>
              <input type="text" id="project-material" name="material" placeholder="Schurwolle, Schafswolle, Mohair...">
            </div>

            <div class="form-group">
              <label for="project-needle-size">Nadelstärke</label>
              <input type="text" id="project-needle-size" name="needleSize" placeholder="3.5 mm">
            </div>
          </fieldset>

          <!-- ============================================================
               FELDGRUPPE 3: PDF-Link
               ============================================================ -->
          <!-- Der PDF-Link muss online erreichbar sein, weil die Projektseite ihn in einem embed-Element anzeigt. -->
          <fieldset>
            <legend>Anleitung</legend>
            
            <!-- Es wird ein Link gespeichert, nicht die PDF-Datei selbst. -->
            <div class="form-group">
              <label for="project-pdf-url">PDF-Link *</label>
              <input type="url" id="project-pdf-url" name="pdfUrl" placeholder="https://.../anleitung.pdf" required>
            </div>
          </fieldset>

          <!-- Der Button speichert ein neues oder bearbeitetes Projekt. -->
          <button type="submit" class="btn-primary">Projekt speichern</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Gemeinsame JavaScript-Datei für Dashboard, Formular und Projektansicht. -->
  <script src="js/app.js"></script>
</body>
</html>
