<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Viewport sorgt dafür, dass die Seite auf mobilen Geräten richtig skaliert. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PatternLab Dashboard - Übersicht aller Häkel- und Strickprojekte mit Fortschritt und Projektverwaltung">
  <title>PatternLab - Dashboard</title>
  <link rel="icon" type="image/jpeg" href="design_prototype/Logo_PatternLab.jpg">
  <!-- Open Sans wird als zentrale Schriftart der Anwendung geladen. -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Gemeinsamer Layout-Container für Sidebar und Hauptbereich. -->
  <div class="container">
    
    <!-- ============================================================
         SIDEBAR: Navigation
         ============================================================ -->
    <aside class="sidebar">
      <!-- App-Name in der Sidebar. -->
      <div class="sidebar-header">
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" aria-label="Navigation öffnen">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="sidebar-brand">
          <img class="sidebar-logo" src="design_prototype/Logo_PatternLab.jpg" alt="PatternLab Logo">
          <span class="app-title">PatternLab</span>
        </div>
      </div>
      
      <!-- Hauptnavigation zwischen Dashboard und Projektformular. -->
      <div class="sidebar-menu-panel">
        <nav id="main-navigation">
          <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="new-project.html">Neues Projekt</a></li>
          </ul>
        </nav>
        <button class="contrast-toggle" type="button" aria-pressed="false" aria-label="Kontrast erhöhen">
          <span aria-hidden="true"></span>
        </button>

        <!-- Link zum Impressum. -->
        <footer>
          <a href="imprint.html">Impressum</a>
        </footer>
      </div>
    </aside>

    <!-- ============================================================
         HAUPTBEREICH: Dashboard
         ============================================================ -->
    <main class="main-content">
      <!-- Übersicht über alle gespeicherten Projekte. -->
      <section id="dashboard">
        <h1>Meine Projekte</h1>
        
        <!-- Link zum Erstellen eines neuen Projekts. -->
        <div class="cta-section">
          <a id="new-project" class="cta-button" href="new-project.html">+ Neues Projekt erstellen</a>
        </div>

        <!-- Filterbereich: Suche und Kategorieauswahl für die Projektkarten. -->
        <button class="filter-toggle" type="button" aria-expanded="false" aria-controls="dashboard-filters">
          Suche & Filter
        </button>
        <div class="dashboard-filters" id="dashboard-filters">
          <label class="visually-hidden" for="project-search">Projekt suchen</label>
          <input type="search" id="project-search" placeholder="Projekt suchen">
          <label class="visually-hidden" for="category-filter">Kategorie filtern</label>
          <select id="category-filter">
            <option value="all">Alle Kategorien</option>
            <option value="haekeln">Häkeln</option>
            <option value="stricken">Stricken</option>
            <option value="andere">Andere</option>
          </select>
        </div>

        <!-- JavaScript fügt hier die Projektkarten aus dem LocalStorage ein. -->
        <div class="projects" id="projects-container">
          <!-- Projektkarten werden hier von JavaScript eingefügt -->
        </div>
      </section>
    </main>
  </div>

  <!-- Gemeinsame JavaScript-Datei für Dashboard, Formular und Projektansicht. -->
  <script src="js/app.js"></script>
</body>
</html>
